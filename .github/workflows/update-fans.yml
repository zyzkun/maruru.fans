name: Update Bilibili follower count

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  update-fans:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch follower count
        env:
          BILIBILI_UID: '3461581784484215'
        run: python scripts/update_fans.py

      - name: Publish updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fans.json
          git diff --cached --quiet || git commit -m "chore: update follower count"
          git push
